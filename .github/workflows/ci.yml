name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Линтер
        run: pip install ruff && ruff check .
      - name: Тесты
        run: python -m unittest discover -s tests -v
